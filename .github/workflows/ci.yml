name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  parity-and-tests:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Checkout upstream VexFlow (pinned)
        run: |
          git clone https://github.com/vexflow/vexflow ../vexflow-5.9.0
          cd ../vexflow-5.9.0
          git checkout 5.9.0

      - name: Verify parity matrix freshness
        run: VF_UPSTREAM_DIR=../vexflow-5.9.0 tools/generate_parity_matrix.sh --check

      - name: Run Swift tests
        run: swift test
